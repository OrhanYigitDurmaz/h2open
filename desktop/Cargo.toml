[package]
name = "h2open-desktop"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
slint = "1.19.0"

[build-dependencies]
slint-build = "1.19.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Duplicate crate versions come from Slint's dependency tree, not from us;
# cargo-deny reports them instead.
multiple_crate_versions = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
undocumented_unsafe_blocks = "deny"
