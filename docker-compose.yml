# Local services for h2open. Values come from .env (copy .env.example).
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the database is never exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/.
      # (h2open_postgres-data is an older Postgres 17 volume, left untouched.)
      - pg18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  asterisk:
    build: infra/asterisk
    image: h2open-asterisk
    restart: unless-stopped
    # Host networking: SIP and RTP behind Docker's NAT cause one-way audio,
    # and the MP-114 reaches Asterisk directly on the LAN. ARI listens on
    # 127.0.0.1 only (http.conf).
    network_mode: host
    environment:
      ARI_USERNAME: ${ARI_USERNAME:?set ARI_USERNAME in .env}
      ARI_PASSWORD: ${ARI_PASSWORD:?set ARI_PASSWORD in .env}
      # Optional until the MP-114 is connected.
      MP114_ADDRESS: ${MP114_ADDRESS:-}
      DESK1_PASSWORD: ${DESK1_PASSWORD:-}
      DESK2_PASSWORD: ${DESK2_PASSWORD:-}
    volumes:
      - ./infra/asterisk/sounds:/var/lib/asterisk/sounds/h2open:ro

  backend:
    build: backend
    image: h2open-backend
    restart: unless-stopped
    # Host networking, like Asterisk: ARI listens on 127.0.0.1 only, and the
    # API is reachable at BACKEND_HOST:BACKEND_PORT (127.0.0.1:8000 unless
    # .env opens it to the LAN for the POS).
    network_mode: host
    env_file: .env
    environment:
      # Postgres is published on the host's loopback (see above).
      POSTGRES_HOST: 127.0.0.1
      # Firebase key, if present, from the read-only secrets/ mount.
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:+/run/secrets/h2open/firebase-service-account.json}
    volumes:
      - ./secrets:/run/secrets/h2open:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg18-data:
