[project]
name = "h2open-backend"
version = "0.1.0"
description = "h2open backend API."
authors = [{ name = "Orhan Yiğit Durmaz" }]
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "import-linter>=2.17",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "all"    # strictest mode: every rule enabled as an error

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
preview = true              # also enable rules ruff hasn't marked stable yet
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",  # D203: conflicts with blank-line-before-class (D211)
    "multi-line-summary-second-line",     # D213: conflicts with multi-line-summary-first-line (D212)
    "missing-trailing-comma",             # COM812: conflicts with ruff format
]

[tool.ruff.lint.flake8-copyright]
# Every Python file must start with this exact two-line header.
notice-rgx = '\A# Copyright \d{4}(-\d{4})? Orhan Yiğit Durmaz\n# SPDX-License-Identifier: AGPL-3.0-or-later\n'
min-file-size = 0

[tool.ruff.lint.flake8-type-checking]
# These classes read their annotations at runtime, so imports used only in
# annotations must stay real imports, not move under `if TYPE_CHECKING:`.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "app.core.events.DomainEvent",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]
# FastAPI dependency aliases (SessionDep) are read at runtime from the
# signatures of dependency functions, which have no decorator to mark them.
exempt-modules = ["typing", "typing_extensions", "app.core.db"]
# FastAPI reads route signatures at runtime to build validation and OpenAPI.
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
]

[tool.ruff.lint.pydocstyle]
convention = "google"       # Args:, Returns:, Raises: sections

[tool.ruff.lint.mccabe]
max-complexity = 8          # default 10

[tool.ruff.lint.pylint]
max-args = 4                # default 5
max-branches = 8            # default 12
max-returns = 4             # default 6
max-statements = 30         # default 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["assert"]  # S101: pytest uses bare assert

[tool.ruff.format]
docstring-code-format = true

[tool.pytest]
strict = true
testpaths = ["tests"]
addopts = ["-ra", "--cov"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layers: cli > main > modules > core"
type = "layers"
layers = ["app.cli", "app.main", "app.modules", "app.core"]

[[tool.importlinter.contracts]]
name = "Module internals (files starting with _) stay private"
type = "private_modules"
packages_with_private_modules = ["app"]

[[tool.importlinter.contracts]]
name = "No import cycles between modules"
type = "acyclic_siblings"
ancestors = ["app.modules"]

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
timezone = "UTC"

# Keep generated migrations in the same shape as hand-written code.
# basedpyright flags op.create_table()'s unused Table result, so assign it to _.
[[tool.alembic.post_write_hooks]]
name = "discard_create_table_result"
type = "exec"
executable = "sed"
options = "-i -E 's/^([[:space:]]+)op[.]create_table[(]/\\1_ = op.create_table(/' REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
