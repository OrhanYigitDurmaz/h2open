; SIP. Addresses and passwords come from .env: the entrypoint writes them
; into pjsip_local.conf (included at the end) when the container starts.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; The AudioCodes MP-114. Landline calls (FXO ports) come in from it, and
; desk phones' outgoing calls go out through it. Identified by its IP
; address (MP114_ADDRESS); there is no password on the trunk.
[mp114]
type = endpoint
transport = transport-udp
context = from-landline
disallow = all
; G.711 A-law is what Turkish lines use; u-law as a fallback.
allow = alaw,ulaw
dtmf_mode = rfc4733
direct_media = no
aors = mp114

; Desk phones on the MP-114's FXS ports. Each port registers to Asterisk
; with its own login (desk1, desk2; DESK1_PASSWORD, DESK2_PASSWORD).
[desk](!)
type = endpoint
transport = transport-udp
context = from-desk
disallow = all
allow = alaw,ulaw
dtmf_mode = rfc4733
direct_media = no

[desk-aor](!)
type = aor
max_contacts = 1
remove_existing = yes

#include "pjsip_local.conf"
