; Dialplan.
[general]
static = yes
writeprotect = yes

; Landline calls from the MP-114. Each FXO port sends its calls to a fixed
; number (line1, line2), so the backend knows which line rang. The backend
; takes it from here: see backend/app/modules/telephony/_controller.py.
[from-landline]
exten => _[a-z0-9].,1,Stasis(h2open,inbound,${EXTEN})
 same => n,Hangup()

; Desk phones (the MP-114's FXS ports) calling out on a free landline.
[from-desk]
exten => _X.,1,Dial(PJSIP/${EXTEN}@mp114,60)
 same => n,Hangup()

; Simulated callers and phones for testing without hardware. Only ARI can
; reach them (as Local/<name>@selftest); no SIP endpoint has this context.
[selftest]
; A caller who waits on the line, or a phone that answers at once.
exten => answer,1,Answer()
 same => n,Wait(120)
; A phone that rings and is never picked up.
exten => noanswer,1,Wait(120)
; A phone that is busy.
exten => busy,1,Busy(5)
