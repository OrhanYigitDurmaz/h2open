; Call-progress tones callers hear, e.g. ringback while the shop and the
; drivers' phones ring. Values for Turkey from ITU-T "Various tones used in
; national networks (according to ITU-T Recommendation E.180)", Annex to ITU
; Operational Bulletin No. 955, position on 1 May 2010. Asterisk's sample
; file has no Turkey section.
;
; Format: frequency/milliseconds, comma-separated, repeated; 0 is silence.
[general]
country = tr

[tr]
description = Turkey
; Analog ringing cadence (only used by analog phones on FXS ports)
ringcadence = 2000,4000
; Dial tone: 450 Hz continuous
dial = 450
; Ringing tone (ringback): 450 Hz, 2.0 s on, 4.0 s off
ring = 450/2000,0/4000
; Busy tone: 450 Hz, 0.5 s on, 0.5 s off
busy = 450/500,0/500
; Congestion tone: 450 Hz, 3 x (0.2 s on, 0.2 s off), 0.6 s on, 0.2 s off
congestion = 450/200,0/200,450/200,0/200,450/200,0/200,450/600,0/200
; Call waiting tone: 450 Hz, 0.2 s on, 0.6 s off, 0.2 s on, 8.0 s off
callwaiting = 450/200,0/600,450/200,0/8000
; Special dial tone: 450 Hz, 1.0 s on, 0.25 s off
dialrecall = 450/1000,0/250
; Special information tone: 950/1400/1800 Hz, 3 x 0.3 s, then 1.0 s off
info = 950/300,1400/300,1800/300,0/1000
